global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "campusconnect-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000", "localhost:8000"]
        labels:
          application: "campusconnect"
          environment: "production"
