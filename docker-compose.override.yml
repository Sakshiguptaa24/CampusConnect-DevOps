# ============================================
# CampusConnect - Docker Compose Dev Overrides
# ============================================
# Automatically loaded by `docker compose up`
# Provides volume mounts for hot reload during development

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    volumes:
      - ./backend/app:/app/app:rw
      - ./backend/alembic:/app/alembic:rw
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DEBUG=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./frontend/src:/build/src:rw
      - ./frontend/public:/build/public:rw
      - ./frontend/index.html:/build/index.html:rw
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "5173:80"
